# Run this workflow on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "*"
    # You MUST limit tags to ones that are compatible with the version scheme of release-script.
    # DO NOT include any others or they will be released as well.
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

permissions:
  contents: read

jobs:
  unit-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm test

  # Publishes to npm with trusted publishing (OIDC), no npm token needed.
  # Configure on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
  # user Garfonso, repository ImapIdleKeepConnection, workflow test-and-release.yml.
  publish:
    # Trigger this step only when a commit is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    needs: [unit-tests]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC token for npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      # No npm cache and no npm ci: no third party code runs while the OIDC token is available,
      # the package has no build step.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Publish package to npm
        run: |
          npm --version
          npm publish

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # release-script puts the changelog of the version into the body of the release commit
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git show -s --format=%b > release-notes.md
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Release $TAG" --notes-file release-notes.md --verify-tag $PRERELEASE
